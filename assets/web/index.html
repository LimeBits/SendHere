<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="chat-page">
<header class="chat-header">
<div class="device-summary">
<h1 id="computer-name">Connecting...</h1>
<div id="connection-status" class="connection-status" aria-live="polite">Connecting</div>
</div>
</header>
<section id="messages" class="messages" aria-label="Transfer messages">
<div id="empty-state" class="empty-state">
<span class="empty-icon" aria-hidden="true">~</span>
<div>No messages yet.</div>
<small id="device-name">Setting up this phone...</small>
</div>
</section>
<footer class="composer-shell">
<div class="composer">
<textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea>
<div class="composer-actions">
<label class="attachment-button" aria-label="Attach files" title="Attach files">
<span aria-hidden="true">+</span>
<input id="files" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.rar,.7z,.txt">
</label>
<button id="send-text" class="send-button" type="button" aria-label="Send"><span aria-hidden="true">&gt;</span>Send</button>
</div>
</div>
<div id="upload-status" class="transfer-status" aria-live="polite"></div>
</footer>
</main>
<script src="/app.js"></script>
</body>
</html>
