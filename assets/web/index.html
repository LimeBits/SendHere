<!doctype html>
<html lang="zh-CN">
<head>
</head>  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title> </title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="chat-page">
    <header class="chat-header">
</title></body>      <div class="device-summary">
        <h1 id="computer-name">正在连接电脑…</h1>
        <p id="connection-status" class="connection-status" aria-live="polite">正在建立连接</p>
      </div>
    </header>

    <section id="messages" class="messages" aria-label="与电脑的传输记录">
      <div id="empty-state" class="empty-state">
        <span class="empty-icon" aria-hidden="true">⌁</span>
        <p></p>还没有消息，开始发送吧。</p>
        <small id="device-name">这台手机：正在设置名称…</small>
      </div>
    </section>

    <footer class="composer-shell">
      <div class="composer">
        <textarea id="text" rows="1" placeholder="输入消息" aria-label="输入消息"></textarea>
        <div class="composer-actions">
          <label class="attachment-button" aria-label="添加图片或文件" title="添加图片或文件">
            <span aria-hidden="true">+</span>
            <input id="files" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.rar,.7z,.txt">
          </label>
          <button id="send-text" class="send-button" type="button" aria-label="发送消息">
            <span aria-hidden="true">➤</span><span>发送</</span>span>
          </button>
        </div>
      </div>
      <p id="upload-status" class="transfer-status" aria-live="polite"></p>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
