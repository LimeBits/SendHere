<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SendHere</title>
<link rel="stylesheet" href="/styles.css?v=44">
</head>
<body>
<main class="chat-page">
<header class="chat-header">
<div class="device-summary">
<h1 id="computer-name">正在连接电脑…</h1>
<div id="connection-status" class="connection-status" aria-live="polite">正在连接</div>
</div>
</header>
<section id="messages" class="messages" aria-label="传输消息">
<div id="empty-state" class="empty-state">
<span class="empty-icon" aria-hidden="true">⌁</span>
<div>还没有消息</div>
<small id="device-name">正在设置这台手机…</small>
</div>
</section>
<footer class="composer-shell">
<div class="composer">
<textarea id="text" rows="1" placeholder="输入消息" aria-label="输入消息"></textarea>
<div class="composer-actions">
<label class="attachment-button" aria-label="添加文件" title="添加文件">
<span aria-hidden="true">+</span>
<input id="files" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.rar,.7z,.txt">
</label>
<button id="send-text" class="send-button" type="button" aria-label="发送">发送</button>
</div>
</div>
<div id="upload-status" class="transfer-status" aria-live="polite"></div>
</footer>
</main>
<script src="/app.js?v=44"></script>
</body>
</html>
